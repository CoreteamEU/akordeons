  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Version constant (load first), fetched with a unique query string
       on every load rather than a plain <script src>. A plain request
       for this exact URL can be served straight from GitHub Pages'
       CDN edge cache (10 min) even on a genuinely fresh page load, which
       is the one request every other ?v=-tagged URL below depends on -
       if this file is stale, everything built from its version number
       is stale too. Fetch's cache:'no-store' would only stop the
       browser's own cache from answering; the CDN edge sits in front of
       that and keys purely on URL, so it could still serve its cached
       copy. Appending a always-different value here forces a URL the
       edge has never seen, which is a guaranteed miss through both
       layers straight to origin. -->
  <script>document.write('<scr' + 'ipt src="js/version.js?_=' + Date.now() + '"><\/scr' + 'ipt>');</script>

  <!-- Stylesheets: written with document.write so the browser requests
       the versioned URL from the start. Appending ?v= after the fact
       (e.g. on DOMContentLoaded, the previous approach) is too late -
       by then the browser has already fetched the unversioned URL, so
       cache-busting silently lost that race on every page load. This
       runs synchronously, before the parser reaches any resource tag
       below it, so only the versioned URL is ever requested. -->
  <script>
    (function() {
      var v = window.APP_VERSION || Date.now();
      document.write('<link rel="stylesheet" href="css/colors.css?v=' + v + '">');
      document.write('<link rel="stylesheet" href="css/main.css?v=' + v + '">');
    })();
  </script>

  <!-- Scripts: same document.write reasoning as the stylesheets above,
       so these also always load the current version, not a cached one. -->
  <script>
    (function() {
      var v = window.APP_VERSION || Date.now();
      ['js/analytics.js', 'js/language.js', 'js/dark-mode.js', 'js/main.js'].forEach(function(src) {
        document.write('<scr' + 'ipt src="' + src + '?v=' + v + '"><\/scr' + 'ipt>');
      });
    })();
  </script>
  <script>
    // Load and display videos
    async function loadVideos() {
      try {
        // Add cache-busting version parameter
        const version = window.APP_VERSION || Date.now();
        const response = await fetch(`data/videos.json?v=${version}`);
        if (!response.ok) {
          throw new Error('Failed to load videos');
        }
        const data = await response.json();
        renderVideos(data.videos);
      } catch (error) {
        console.error('Error loading videos:', error);
        document.getElementById('videos-container').innerHTML = '<p>Error loading videos</p>';
      }
    }

    function renderVideos(videos) {
      const container = document.getElementById('videos-container');
      if (!container || !videos) return;

      container.innerHTML = videos.map(video => {
        const embedUrl = `https://www.youtube.com/embed/${video.id}`;
        const thumbnailUrl = video.thumbnail || `https://img.youtube.com/vi/${video.id}/maxresdefault.jpg`;
        
        return `
          <div class="video-item">
            <div class="video-wrapper">
              <iframe 
                src="${embedUrl}" 
                title="${video.title}"
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen
                loading="lazy">
              </iframe>
            </div>
            <div class="video-info">
              <h3 class="video-title">${video.title}</h3>
              ${video.description ? `<p class="video-description">${video.description}</p>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Load videos when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadVideos);
    } else {
      loadVideos();
    }
  </script>

  <style>
    .videos-grid {

    .video-wrapper {

      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
