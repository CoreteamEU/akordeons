<!DOCTYPE html>
<html lang="lv" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Akordeoniste Evita Dūra - Video" data-i18n="meta.description">
  <meta name="keywords" content="akordeons, accordion, musette, undertango" data-i18n="meta.keywords">
  <title data-i18n="videos.title">Video - Akordeoniste Evita Dūra</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo">
        <img src="images/akordeons_logo_white.png" alt="Akordeoniste Evita Dūra" onerror="this.style.display='none'">
        <span class="logo-text" data-i18n="header.title">Akordeoniste Evita Dūra</span>
      </div>
      
      <div class="contact-info">
        <a href="tel:+37129115951" data-i18n="header.phone">+37129115951</a>
        <a href="mailto:evita.duura@gmail.com" data-i18n="header.email">evita.duura@gmail.com</a>
      </div>
      
      <div class="header-controls">
        <div class="language-switcher">
          <button type="button" data-lang="lv" aria-label="Latviešu">LV</button>
          <button type="button" data-lang="ru" aria-label="Русский">RU</button>
          <button type="button" data-lang="en" aria-label="English">EN</button>
        </div>
        <button type="button" class="dark-mode-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <div class="nav-container">
      <button type="button" class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <ul class="nav-menu">
        <li><a href="index.html" data-i18n="navigation.home">Ieraksti</a></li>
        <li><a href="music.html" data-i18n="navigation.music">Mūzika</a></li>
        <li><a href="videos.html" class="active" data-i18n="navigation.videos">Video</a></li>
        <li><a href="about.html" data-i18n="navigation.about">Evita</a></li>
        <li><a href="contact.html" data-i18n="navigation.contact">Kontakti</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <h1 data-i18n="videos.title">Video</h1>
    <p data-i18n="videos.description">Skatieties video ierakstus no koncertiem un izpildījumiem.</p>
    
    <div id="videos-container" class="videos-grid">
      <!-- Videos will be loaded here -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-contact">
        <a href="tel:+37129115951" data-i18n="footer.phone">+37129115951</a>
        <a href="mailto:evita.duura@gmail.com" data-i18n="footer.email">evita.duura@gmail.com</a>
      </div>
      <div class="footer-copyright" data-i18n="footer.copyright">© 2024 Akordeoniste Evita Dūra</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/analytics.js"></script>
  <script src="js/language.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Load and display videos
    async function loadVideos() {
      try {
        const response = await fetch('data/videos.json');
        if (!response.ok) {
          throw new Error('Failed to load videos');
        }
        const data = await response.json();
        renderVideos(data.videos);
      } catch (error) {
        console.error('Error loading videos:', error);
        document.getElementById('videos-container').innerHTML = '<p>Error loading videos</p>';
      }
    }

    function renderVideos(videos) {
      const container = document.getElementById('videos-container');
      if (!container || !videos) return;

      container.innerHTML = videos.map(video => {
        const embedUrl = `https://www.youtube.com/embed/${video.id}`;
        const thumbnailUrl = video.thumbnail || `https://img.youtube.com/vi/${video.id}/maxresdefault.jpg`;
        
        return `
          <div class="video-item">
            <div class="video-wrapper">
              <iframe 
                src="${embedUrl}" 
                title="${video.title}"
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen
                loading="lazy">
              </iframe>
            </div>
            <div class="video-info">
              <h3 class="video-title">${video.title}</h3>
              ${video.description ? `<p class="video-description">${video.description}</p>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Load videos when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadVideos);
    } else {
      loadVideos();
    }
  </script>

  <style>
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .video-item {
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-info {
      padding: 1rem;
    }

    .video-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: var(--color-text-primary);
    }

    .video-description {
      color: var(--color-text-secondary);
      font-size: 0.9rem;
      margin: 0;
    }

    @media (max-width: 768px) {
      .videos-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }
  </style>
</body>
</html>
