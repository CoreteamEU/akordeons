      // Update CSS links
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
          if (!link.href.includes('?v=')) {
            link.href += (link.href.includes('?') ? '&' : '?') + 'v=' + version;
          }
        });
        
        // Update script tags (except version.js itself)
        document.querySelectorAll('script[src]').forEach(script => {
          if (script.src && !script.src.includes('?v=') && !script.src.includes('version.js')) {
            script.src += (script.src.includes('?') ? '&' : '?') + 'v=' + version;
          }
        });
      });
    })();
