<!DOCTYPE html>
<html lang="lv" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Akordeoniste Evita Dūra - Mūzika" data-i18n="meta.description">
  <meta name="keywords" content="akordeons, accordion, musette, undertango" data-i18n="meta.keywords">
  <title data-i18n="music.title">Mūzika - Akordeoniste Evita Dūra</title>
  
  <!-- Prevent caching during development -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Version constant (load first) -->
  <script src="js/version.js"></script>
  <script>
    // Auto-apply version to CSS and JS resources
    (function() {
      const version = window.APP_VERSION || Date.now();
      
      // Update CSS links
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
          if (!link.href.includes('?v=')) {
            link.href += (link.href.includes('?') ? '&' : '?') + 'v=' + version;
          }
        });
        
        // Update script tags (except version.js itself)
        document.querySelectorAll('script[src]').forEach(script => {
          if (script.src && !script.src.includes('?v=') && !script.src.includes('version.js')) {
            script.src += (script.src.includes('?') ? '&' : '?') + 'v=' + version;
          }
        });
      });
    })();
  </script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo">
        <img src="images/akordeons_logo_white.png" alt="Akordeoniste Evita Dūra" onerror="this.style.display='none'">
        <span class="logo-text" data-i18n="header.title">Akordeoniste Evita Dūra</span>
      </div>
      
      <div class="contact-info">
        <a href="tel:+37129115951" data-i18n="header.phone">+37129115951</a>
        <a href="mailto:evita.duura@gmail.com" data-i18n="header.email">evita.duura@gmail.com</a>
      </div>
      
      <div class="header-controls">
        <div class="language-switcher">
          <button type="button" data-lang="lv" aria-label="Latviešu">LV</button>
          <button type="button" data-lang="ru" aria-label="Русский">RU</button>
          <button type="button" data-lang="en" aria-label="English">EN</button>
        </div>
        <button type="button" class="dark-mode-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <div class="nav-container">
      <button type="button" class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <ul class="nav-menu">
        <li><a href="index.html" class="active" data-i18n="navigation.music">Mūzika</a></li>
        <li><a href="about.html" data-i18n="navigation.about">Evita</a></li>
        <li><a href="videos.html" data-i18n="navigation.videos">Video</a></li>
        <li><a href="contact.html" data-i18n="navigation.contact">Kontakti</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <h1 data-i18n="music.title">Mūzika</h1>
    <p data-i18n="music.description">Klausieties dažādus mūzikas ierakstus - solo, duetus un kvarteta Undertango kompozīcijas.</p>
    
    <!-- Playlist containers -->
    <div id="playlist-solo"></div>
    <div id="playlist-duets"></div>
    <div id="playlist-kvartets_undertango"></div>
    <div id="playlist-duo_violinist"></div>
    <div id="playlist-undertango_live"></div>
    <div id="playlist-undertango_collaborations"></div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-contact">
        <a href="tel:+37129115951" data-i18n="footer.phone">+37129115951</a>
        <a href="mailto:evita.duura@gmail.com" data-i18n="footer.email">evita.duura@gmail.com</a>
      </div>
      <div class="footer-copyright" data-i18n="footer.copyright">© Akordeoniste Evita Dūra</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/analytics.js"></script>
  <script src="js/language.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/main.js"></script>
  <script src="js/mp3-player.js"></script>
  <script>
    // Initialize players when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      const playlists = [
        'solo',
        'duets',
        'kvartets_undertango',
        'duo_violinist',
        'undertango_live',
        'undertango_collaborations'
      ];

      playlists.forEach(playlistId => {
        const container = document.getElementById(`playlist-${playlistId}`);
        if (container) {
          new MP3Player(`playlist-${playlistId}`, playlistId);
        }
      });
    });
  </script>
</body>
</html>
