       document.write-based approach was invisible to the preload scanner
       and forced every file to load strictly one at a time (~1.7s of
       measured render-blocking delay). dev_server.py rewrites this
       version number across every Build/*.html file (and js/version.js)
       whenever anything under Build/ changes, so this still bumps

  <script src="js/mp3-player.js?v=1786015277"></script>
  <script>
    // Initialize players when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      const playlists = [
        'solo',
        'duets',
        'kvartets_undertango',
        'duo_violinist',
        'undertango_live',
        'undertango_collaborations'
      ];

      playlists.forEach(playlistId => {
        const container = document.getElementById(`playlist-${playlistId}`);
        if (container) {
          new MP3Player(`playlist-${playlistId}`, playlistId);
        }
      });
    });
  </script>
