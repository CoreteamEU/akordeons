       version number across every Build/*.html file (and js/version.js)

  <!-- Scripts: versioned the same static way as the stylesheets in

  <script src="js/main.js?v=1791958383"></script>
  <script src="js/mp3-player.js?v=1791958383"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const playlistId = params.get('playlist') || '';
      const trackFilename = params.get('track') || '';
      const container = document.getElementById('playlist-single');

      // playlistId becomes part of a fetch path, so only allow known-safe ids.
      if (!/^[a-z0-9_]+$/.test(playlistId) || !trackFilename) {
        container.innerHTML = '<p class="player-not-found" data-i18n="player.notFound">Ieraksts nav atrasts</p>';
        if (typeof languageManager !== 'undefined') languageManager.updatePageContent();
        return;
      }

      document.getElementById('playlist-link').href = `index.html#playlist-${playlistId}`;

      container.addEventListener('playlistload', (e) => {
        const track = e.detail.playlist && e.detail.playlist.tracks[0];
        if (!track) return;
        const heading = document.getElementById('track-heading');
        heading.removeAttribute('data-i18n');
        heading.textContent = track.title;
        const setTitle = () => {
          const site = (typeof languageManager !== 'undefined' && languageManager.getContent('meta.title')) || 'Akordeoniste Evita Dūra';
          document.title = `${track.title} - ${site}`;
        };
        setTitle();
        // LanguageManager resets document.title on every language load.
        window.addEventListener('languagechange', setTitle);
      });

      new MP3Player('playlist-single', playlistId, { trackFilename });
    });
  </script>
